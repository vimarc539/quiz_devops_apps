apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml
  # - ingress.yaml  # Uncomment if using ingress

images:
  - name: DOCKER_USERNAME/quiz-app
    newName: DOCKER_USERNAME/quiz-app
    newTag: latest

commonLabels:
  app: quiz-app
  managed-by: kustomize

replicas:
  - name: quiz-app
    count: 3

