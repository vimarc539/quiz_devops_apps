name: CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/quiz-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run -d -p 3000:3000 --name test-container ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        sleep 5
        curl -f http://localhost:3000/api/quiz/health || exit 1
        docker stop test-container
        docker rm test-container

  notify:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Send status notification
      run: |
        STATUS="${{ needs.build-and-test.result }}"
        REPO="${{ github.repository }}"
        BRANCH="${{ github.ref_name }}"
        COMMIT="${{ github.sha }}"
        AUTHOR="${{ github.actor }}"
        
        if [ "$STATUS" == "success" ]; then
          echo "✅ CI Pipeline PASSED"
          echo "Repository: $REPO"
          echo "Branch: $BRANCH"
          echo "Commit: ${COMMIT:0:7}"
          echo "Author: $AUTHOR"
          echo ""
          echo "All tests passed! Ready to deploy."
        else
          echo "❌ CI Pipeline FAILED"
          echo "Repository: $REPO"
          echo "Branch: $BRANCH"
          echo "Commit: ${COMMIT:0:7}"
          echo "Author: $AUTHOR"
          echo ""
          echo "Please check the logs and fix the issues."
          exit 1
        fi