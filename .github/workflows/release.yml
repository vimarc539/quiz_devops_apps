name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/quiz-app

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.VERSION }}
          ${{ env.DOCKER_IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ steps.version.outputs.VERSION }}
        body: |
          ## Release ${{ steps.version.outputs.VERSION }}
          
          ### Changes
          - New release with version ${{ steps.version.outputs.VERSION }}
          
          ### Docker Images
          - `${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.VERSION }}`
          - `${{ env.DOCKER_IMAGE }}:latest`
          
          ### Installation
```bash
          docker pull ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.VERSION }}
          docker run -p 3000:3000 ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.VERSION }}
```
          
          ### Verification
```bash
          curl http://localhost:3000/api/quiz/health
```
        draft: false
        prerelease: false

    - name: Notify release success
      run: |
        echo "✅ Release ${{ steps.version.outputs.VERSION }} completed successfully!"
        echo "Docker images pushed to Docker Hub"
        echo "GitHub release created"